services:
  postgres:
    image: postgres:16-alpine
    container_name: condo-reserva-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: condo_reserva
    volumes:
      - condo_reserva_data:/var/lib/postgresql/data

volumes:
  condo_reserva_data: