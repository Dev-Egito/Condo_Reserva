services:
  postgres:
    image: postgres:16-alpine
    container_name: condo-reserva-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-condo_reserva}
    volumes:
      - condo_reserva_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-condo_reserva}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    container_name: condo-reserva-api
    ports:
      - "3001:3001"
    env_file:
      - ./api/.env
    environment:
      PORT: ${PORT:-3001}
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-condo_reserva}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/api/node_modules
      - /app/frontend/node_modules
      - /app/shared/node_modules
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: condo-reserva-frontend
    ports:
      - "5173:5173"
    environment:
      VITE_API_URL: ${VITE_API_URL:-http://localhost:3001}
    volumes:
      - .:/app
      - /app/node_modules
      - /app/api/node_modules
      - /app/frontend/node_modules
      - /app/shared/node_modules
    depends_on:
      - api

volumes:
  condo_reserva_data:
    name: condo_reserva_condo_reserva_data
    external: true